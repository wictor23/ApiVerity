name: Testes de API - ServeRest (Mocha)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  regressao:
    name: Regressao da API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Cache do binario do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Executar suite
        env:
          API_BASE_URL: https://serverest.dev
        run: npx cypress run

      - name: Publicar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-api-mocha
          path: cypress/reports
          retention-days: 30
          if-no-files-found: warn

      - name: Publicar no Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: cypress/reports